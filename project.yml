name: SeekDeep
include:
  - app/addons/addons.yml
options:
  bundleIdPrefix: to.seekdeep
  deploymentTarget:
    macOS: "14.0"
packages:
  SeekDeepCore:
    path: core
  BareKit:
    url: https://github.com/holepunchto/bare-kit-swift
    branch: main
targets:
  SeekDeep:
    type: application
    platform: macOS
    sources:
      - path: app
        excludes: [frameworks, addons, app.bundle, Info.plist, SeekDeep.entitlements]
      - path: app/app.bundle
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.seekdeep.native
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
      configs:
        # xcodegen does not add this by default, and every `#if DEBUG` in the app (the
        # process transport, the dev scheme) is dead code without it.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    info:
      path: app/Info.plist
      properties:
        CFBundleName: SeekDeep
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        # A new bundle id inherits no saved state, and a failed window restoration makes
        # SwiftUI show *no* window at all (which looks exactly like a hang).
        NSQuitAlwaysKeepsWindows: false
        NSApplicationSupportsSecureRestorableState: true
        CFBundleURLTypes:
          - CFBundleURLName: to.seekdeep.native
            CFBundleURLSchemes:
              - seekdeep
    entitlements:
      path: app/SeekDeep.entitlements
      properties:
        com.apple.security.cs.allow-jit: true
        com.apple.security.cs.allow-unsigned-executable-memory: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        # The bare addons are prebuilt frameworks signed by the Holepunch team. An ad-hoc
        # signed host therefore fails library validation on launch in Release, so the
        # exception is required until the addons are re-signed with our own identity.
        com.apple.security.cs.disable-library-validation: true
    dependencies:
      - package: SeekDeepCore
      - package: BareKit
    scheme:
      environmentVariables:
        SEEKDEEP_DEV_TRANSPORT: process
      testTargets:
        - SeekDeepTests
      preActions:
        - name: Link
          script: |
            set -e
            PATH="${PATH}" "${PWD}/node_modules/.bin/bare-link" --preset darwin --out ${PWD}/app/addons ${PWD}
        - name: Pack
          script: |
            set -e
            # bare-pack does NOT parse its input: a file with an unbalanced brace packs
            # happily and fails only when the worklet boots. Check syntax first, or a
            # broken worklet ships inside a green build.
            node --check ${PWD}/worklet/backend.js
            node --check ${PWD}/worklet/worklet.js
            node --check ${PWD}/worklet/pipe-adapter.js
            PATH="${PATH}" "${PWD}/node_modules/.bin/bare-pack" --preset darwin --linked --base ${PWD} --out ${PWD}/app/app.bundle ${PWD}/worklet/backend.js
            test -s "${PWD}/app/app.bundle"
  SeekDeepTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - package: SeekDeepCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
