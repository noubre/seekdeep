<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' http://localhost:11434 http://localhost:1234">
  <link rel="stylesheet" href="./css/app.css">
  <!-- Marked.js for Markdown parsing -->
  <script src="./lib/marked.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <!-- History Browser Overlay -->
  <div id="history-overlay"></div>
  
  <!-- History Browser Sidebar -->
  <div id="history-sidebar">
    <div class="sidebar-header">
      <h2>Chat History</h2>
      <button class="sidebar-close" id="history-close">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="sidebar-search">
      <input type="text" id="session-search" placeholder="Search sessions...">
    </div>
    <div id="session-list">
      <!-- Sessions will be dynamically added here -->
    </div>
    <div class="sidebar-footer">
      <div id="storage-info">
        <div class="storage-stats">
          <span>0 sessions</span>
          <span>•</span>
          <span>0 KB used</span>
        </div>
      </div>
    </div>
  </div>
  
  <div id="bar">
    <button id="history-toggle">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      History
    </button>
    <pear-ctrl></pear-ctrl>
  </div>
  
  <!-- Join Session UI -->
  <div id="join-section">
    <div class="join-section-row">
      <label>Current Topic:</label>
      <div class="topic-display">
        <div class="topic-container">
          <span id="current-topic" class="monospace"></span>
          <button id="copy-topic" title="Copy topic key">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
    
    <div class="join-section-row">
      <label for="topic-key">Join a friend's chat:</label>
      <div class="join-controls">
        <input type="text" id="topic-key" placeholder="Enter topic key..." />
        <button id="join-button">Join Chat</button>
      </div>
    </div>
    
  </div>
  
  <!-- Chat container with active users and messages -->
  <div id="chat-container">
    <div id="active-users">
      <!-- Active users will be added here dynamically -->
      <div class="user-chip">
        <span class="status-indicator"></span>
        You
      </div>
    </div>
    <div id="chat-messages" role="log" aria-live="polite" aria-relevant="additions text">
      <!-- Chat messages will be added here dynamically -->
    </div>
  </div>
  
  <form>
    <div class="model-control">
      <label for="provider-select">Provider:</label>
      <select id="provider-select" name="provider">
        <option value="ollama">Ollama</option>
        <option value="lmstudio">LM Studio</option>
      </select>
      <label for="model-select">Model:</label>
      <select id="model-select" name="model"></select>
      <button type="button" id="refresh-models" title="Refresh model list">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
          <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </div>
    <div class="model-control mode-toggle">
      <label for="chat-mode">Mode:</label>
      <select id="chat-mode" name="chat-mode">
        <option value="private">Private — only requester sees responses</option>
        <option value="collaborative">Collaborative — everyone sees prompts and responses</option>
      </select>
    </div>
    <div class="model-control persistence-control">
      <label class="persistence-label">
        <input type="checkbox" id="persistence-enabled" checked class="persistence-checkbox">
        <span>Save History</span>
      </label>
      <button type="button" id="export-history" title="Export chat history">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </button>
      <button type="button" id="clear-history" title="Clear chat history">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </div>
    <textarea name="prompt" aria-label="Message prompt" aria-describedby="slash-command-hint" placeholder="Type your message here... (Ctrl+Enter to send)"></textarea>
    <div class="composer-discovery">
      <span id="slash-command-hint">Slash command details are loading.</span>
      <button type="button" id="slash-help-button" aria-label="Insert /p2p help into the message prompt">Help</button>
    </div>
    <div class="composer-submit">
      <input type="submit" value="Seek" class="composer-submit-button">
    </div>
  </form>
</body>
</html>
